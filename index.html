<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta id="vp" name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      (function(){
        try {
          var w = Math.min(screen.width, screen.height);
          if (w > 0 && w < 600) {
            var k = 1.15;
            var vw = Math.round(w / k);
            var vp = document.getElementById('vp');
            if (vp) {
              vp.setAttribute('content', 'width=' + vw + ', initial-scale=' + k + ', minimum-scale=' + k + ', maximum-scale=' + k + ', user-scalable=no, viewport-fit=cover');
            }
          }
        } catch(e) {}
      })();
    </script>
    <meta name="theme-color" content="#165c4d" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
