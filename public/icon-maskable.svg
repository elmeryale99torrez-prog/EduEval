<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#19594b"/>
      <stop offset="100%" stop-color="#0e362d"/>
    </linearGradient>
    <radialGradient id="haloGradMask" cx="50%" cy="58%" r="50%">
      <stop offset="0%" stop-color="#f8a452" stop-opacity="0.38"/>
      <stop offset="70%" stop-color="#f8a452" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#165c4d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sparkGradMask" x1="20%" y1="10%" x2="70%" y2="90%">
      <stop offset="0%" stop-color="#ffe699"/>
      <stop offset="25%" stop-color="#f8a452"/>
      <stop offset="65%" stop-color="#ff7a29"/>
      <stop offset="100%" stop-color="#e64a19"/>
    </linearGradient>
    <linearGradient id="bellyGradMask" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fff4d1" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#fed686" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="softGlowMask" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0a1d17" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Fondo completo cuadrado para icon maskable -->
  <rect width="512" height="512" fill="url(#bgGradMask)"/>

  <!-- Halo de resplandor cálido -->
  <circle cx="256" cy="275" r="160" fill="url(#haloGradMask)"/>

  <g transform="translate(25.6, 25.6) scale(0.9)">
    <!-- Chispas secundarias flotantes -->
    <path d="M 360 120 Q 365 105 375 105 Q 365 105 360 90 Q 355 105 345 105 Q 355 105 360 120 Z" fill="#ffe29a" opacity="0.9"/>
    <path d="M 148 165 Q 152 154 160 154 Q 152 154 148 143 Q 144 154 136 154 Q 144 154 148 165 Z" fill="#ffd17a" opacity="0.75"/>
    <circle cx="370" cy="195" r="4" fill="#ffe29a" opacity="0.6"/>

    <!-- Cuerpo de la Chispa Curiosa -->
    <g filter="url(#softGlowMask)">
      <path d="
        M 256 385
        C 185 385, 142 320, 154 245
        C 162 195, 196 162, 235 128
        C 255 110, 276 80, 298 72
        C 305 69, 312 75, 307 88
        C 292 126, 308 152, 338 198
        C 372 250, 368 318, 336 358
        C 314 382, 285 385, 256 385 Z
      " fill="url(#sparkGradMask)"/>

      <!-- Vientre suave / luz interior -->
      <path d="
        M 256 368
        C 205 368, 175 320, 184 265
        C 190 226, 218 200, 246 172
        C 260 158, 274 135, 288 128
        C 281 156, 292 174, 314 208
        C 338 248, 336 300, 314 336
        C 298 360, 276 368, 256 368 Z
      " fill="url(#bellyGradMask)"/>
    </g>

    <!-- Mejillas sonrosadas -->
    <ellipse cx="198" cy="270" rx="14" ry="8" fill="#e64a19" opacity="0.32"/>
    <ellipse cx="314" cy="270" rx="14" ry="8" fill="#e64a19" opacity="0.32"/>

    <!-- Ojos curiosos expresivos -->
    <g>
      <!-- Ojo izquierdo -->
      <ellipse cx="216" cy="246" rx="17" ry="21" fill="#12251f"/>
      <circle cx="211" cy="239" r="6.5" fill="#ffffff"/>
      <circle cx="222" cy="252" r="3.2" fill="#ffffff"/>

      <!-- Ojo derecho -->
      <ellipse cx="296" cy="246" rx="17" ry="21" fill="#12251f"/>
      <circle cx="291" cy="239" r="6.5" fill="#ffffff"/>
      <circle cx="302" cy="252" r="3.2" fill="#ffffff"/>
    </g>

    <!-- Sonrisa amigable -->
    <path d="M 238 273 Q 256 291 274 273" stroke="#12251f" stroke-width="6" stroke-linecap="round" fill="none"/>
  </g>
</svg>
